name: Release SakuraMeter

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          rm -rf dist "SakuraMeter-${VERSION}.zip"
          mkdir -p dist
          cp manifest.json dist/
          cp *.js dist/
          cp *.css dist/
          cp *.html dist/
          cp privacy-policy.md dist/
          cp -R assets dist/
          cp -R _locales dist/
          cp -R locales dist/
          cp -R frontend dist/
          cp -R sidechat dist/
          cd dist
          zip -r "../SakuraMeter-${VERSION}.zip" .
          cd ..
          unzip -t "SakuraMeter-${VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: SakuraMeter-*.zip
