name: Release SakuraMeter

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A publisher has only one draft. Never overlap or cancel an active submission.
concurrency:
  group: sakurameter-store-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and build ZIP once
        id: package
        run: python3 .github/scripts/release-package.py build --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release/SakuraMeter-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release
      - name: Verify exact build artifact
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: python3 .github/scripts/release-package.py verify --zip "release/SakuraMeter-$VERSION.zip" --version "$VERSION" --sha256 "$SHA256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/SakuraMeter-${{ needs.build.outputs.version }}.zip

  publish-stores:
    name: Submit ${{ matrix.store }}
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One store failure must not suppress the other store's submission.
      fail-fast: false
      matrix:
        store: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate store gate
        id: gate
        env:
          STORE: ${{ matrix.store }}
          CHROME_STORE_PUBLISH_ENABLED: ${{ vars.CHROME_STORE_PUBLISH_ENABLED }}
          EDGE_STORE_PUBLISH_ENABLED: ${{ vars.EDGE_STORE_PUBLISH_ENABLED }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { enabled } from './.github/scripts/store-publish.mjs';
          const active = enabled(process.env[`${process.env.STORE.toUpperCase()}_STORE_PUBLISH_ENABLED`]);
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${active}\n`);
          console.log(active ? 'Store enabled' : 'Store safely skipped: disabled');
          JS
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release
      - name: Verify exact build artifact
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: python3 .github/scripts/release-package.py verify --zip "release/SakuraMeter-$VERSION.zip" --version "$VERSION" --sha256 "$SHA256"
      - name: Upload and submit Chrome
        if: steps.gate.outputs.enabled == 'true' && matrix.store == 'chrome'
        env:
          ZIP_PATH: release/SakuraMeter-${{ needs.build.outputs.version }}.zip
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
          CHROME_STORE_PUBLISH_ENABLED: ${{ vars.CHROME_STORE_PUBLISH_ENABLED }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
        run: bash .github/scripts/chrome-store-publish.sh
      - name: Upload and submit Edge
        if: steps.gate.outputs.enabled == 'true' && matrix.store == 'edge'
        env:
          ZIP_PATH: release/SakuraMeter-${{ needs.build.outputs.version }}.zip
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
          EDGE_STORE_PUBLISH_ENABLED: ${{ vars.EDGE_STORE_PUBLISH_ENABLED }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: bash .github/scripts/edge-store-publish.sh
